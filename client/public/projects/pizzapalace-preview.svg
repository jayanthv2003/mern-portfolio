<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#181318" />
      <stop offset="100%" stop-color="#0E0D14" />
    </linearGradient>
    <linearGradient id="warm-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="pp-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231F2A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#14121A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="pp-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pp-bg)" />

  <!-- Subtle warm ambient circles -->
  <circle cx="150" cy="80" r="180" fill="#EF4444" fill-opacity="0.06" filter="blur(40px)" />
  <circle cx="680" cy="380" r="160" fill="#F59E0B" fill-opacity="0.06" filter="blur(40px)" />

  <!-- Main Window -->
  <g filter="url(#pp-shadow)">
    <rect x="40" y="30" width="720" height="390" rx="12" fill="url(#pp-card)" stroke="#3E3848" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <path d="M 40 42 A 12 12 0 0 1 52 30 L 748 30 A 12 12 0 0 1 760 42 L 760 70 L 40 70 Z" fill="#17141D" />
    <line x1="40" y1="70" x2="760" y2="70" stroke="#3E3848" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="62" cy="50" r="5" fill="#EF4444" />
    <circle cx="78" cy="50" r="5" fill="#F59E0B" />
    <circle cx="94" cy="50" r="5" fill="#10B981" />

    <!-- Title & Stack Indicator -->
    <text x="120" y="55" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">
      🍕 Pizza Palace — Full-Stack Order &amp; Admin Dashboard
    </text>
    <rect x="555" y="42" width="190" height="20" rx="10" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
    <circle cx="568" cy="52" r="3.5" fill="#EF4444" />
    <text x="578" y="56" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">
      PHP • MySQL • Tailwind • XSS Safe
    </text>

    <!-- Top KPI Cards -->
    <g transform="translate(60, 85)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="155" height="54" rx="8" fill="#1A1622" stroke="#3E3848" stroke-width="1" />
      <text x="14" y="20" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Active Orders</text>
      <text x="14" y="42" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">38</text>
      <text x="55" y="42" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">↑ +14% today</text>

      <!-- KPI 2 -->
      <rect x="175" y="0" width="155" height="54" rx="8" fill="#1A1622" stroke="#3E3848" stroke-width="1" />
      <text x="14" y="20" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Today&apos;s Revenue</text>
      <text x="14" y="42" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">₹24,850</text>

      <!-- KPI 3 -->
      <rect x="350" y="0" width="155" height="54" rx="8" fill="#1A1622" stroke="#3E3848" stroke-width="1" />
      <text x="14" y="20" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Avg. Delivery Time</text>
      <text x="14" y="42" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">22 mins</text>

      <!-- KPI 4 -->
      <rect x="525" y="0" width="155" height="54" rx="8" fill="#1A1622" stroke="#3E3848" stroke-width="1" />
      <text x="14" y="20" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Endpoint Security</text>
      <text x="14" y="42" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Prepared SQL ✓</text>
    </g>

    <!-- Live Order Pipeline Progress Bar -->
    <g transform="translate(60, 155)">
      <rect x="0" y="0" width="680" height="42" rx="8" fill="#17131F" stroke="#3E3848" stroke-width="1" />
      <text x="16" y="25" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Live Order #1084</text>

      <!-- Stepper dots and lines -->
      <line x1="160" y1="21" x2="650" y2="21" stroke="#332E3C" stroke-width="3" />
      <line x1="160" y1="21" x2="480" y2="21" stroke="#10B981" stroke-width="3" />

      <circle cx="160" cy="21" r="7" fill="#10B981" />
      <text x="145" y="36" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Order Placed</text>

      <circle cx="320" cy="21" r="7" fill="#10B981" />
      <text x="305" y="36" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Kitchen Prep</text>

      <circle cx="480" cy="21" r="7" fill="#10B981" />
      <text x="460" y="36" fill="#10B981" font-family="'Inter', sans-serif" font-size="9">Out for Delivery</text>

      <circle cx="640" cy="21" r="7" fill="#332E3C" />
      <text x="625" y="36" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Delivered</text>
    </g>

    <!-- Order Management Table -->
    <g transform="translate(60, 212)">
      <rect x="0" y="0" width="680" height="190" rx="8" fill="#17131F" stroke="#3E3848" stroke-width="1" />

      <!-- Table Header -->
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 672 0 A 8 8 0 0 1 680 8 L 680 32 L 0 32 Z" fill="#1F1A28" />
      <text x="20" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ORDER ID</text>
      <text x="120" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CUSTOMER / ITEMS</text>
      <text x="360" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">AMOUNT</text>
      <text x="460" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">STATUS</text>
      <text x="580" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ACTION</text>
      <line x1="0" y1="32" x2="680" y2="32" stroke="#3E3848" stroke-width="1" />

      <!-- Row 1 -->
      <g transform="translate(0, 32)">
        <text x="20" y="25" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">#ORD-1084</text>
        <text x="120" y="20" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Rohit S. — 2x Gourmet Farmhouse Pizza</text>
        <text x="120" y="34" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Garlic Breadsticks + 1x Pepsi (750ml)</text>
        <text x="360" y="25" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">₹849.00</text>
        <rect x="460" y="12" width="95" height="20" rx="4" fill="#065F46" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
        <text x="470" y="26" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="500">On the Way</text>
        <rect x="580" y="12" width="70" height="20" rx="4" fill="#332E3C" />
        <text x="596" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Manage</text>
        <line x1="0" y1="48" x2="680" y2="48" stroke="#2D2836" stroke-width="1" />
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 80)">
        <text x="20" y="25" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">#ORD-1083</text>
        <text x="120" y="20" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Kavya M. — 1x Peri Peri Paneer Burst</text>
        <text x="120" y="34" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Choco Lava Cake + Cheese Dip</text>
        <text x="360" y="25" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">₹560.00</text>
        <rect x="460" y="12" width="95" height="20" rx="4" fill="#7C2D12" fill-opacity="0.4" stroke="#F97316" stroke-width="1" />
        <text x="472" y="26" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Kitchen Prep</text>
        <rect x="580" y="12" width="70" height="20" rx="4" fill="#332E3C" />
        <text x="596" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Manage</text>
        <line x1="0" y1="48" x2="680" y2="48" stroke="#2D2836" stroke-width="1" />
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 128)">
        <text x="20" y="25" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">#ORD-1082</text>
        <text x="120" y="20" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Aditya N. — 3x Classic Margherita &amp; Dip</text>
        <text x="120" y="34" fill="#64748B" font-family="'Inter', sans-serif" font-size="9">Delivered in 18 mins (Payment: Online/UPI)</text>
        <text x="360" y="25" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">₹1,120.00</text>
        <rect x="460" y="12" width="95" height="20" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1" />
        <text x="480" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">Delivered</text>
        <rect x="580" y="12" width="70" height="20" rx="4" fill="#332E3C" />
        <text x="600" y="26" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Receipt</text>
      </g>
    </g>
  </g>
</svg>

