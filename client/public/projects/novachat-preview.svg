<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="720" height="390" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Title Bar -->
    <path d="M 40 42 A 12 12 0 0 1 52 30 L 748 30 A 12 12 0 0 1 760 42 L 760 70 L 40 70 Z" fill="#0F172A" />
    <line x1="40" y1="70" x2="760" y2="70" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="62" cy="50" r="5" fill="#EF4444" />
    <circle cx="78" cy="50" r="5" fill="#F59E0B" />
    <circle cx="94" cy="50" r="5" fill="#10B981" />

    <!-- Title & Status -->
    <text x="120" y="55" fill="#E2E8F0" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="600" font-size="13">
      NovaChat — Context-Aware AI Chatbot &amp; Dialogue Manager
    </text>
    <rect x="580" y="42" width="165" height="20" rx="10" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <circle cx="592" cy="52" r="3.5" fill="#38BDF8" />
    <text x="602" y="56" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">
      spaCy NLU • Qwen2.5-7B
    </text>

    <!-- Sidebar (Dialogue Context) -->
    <rect x="40" y="70" width="220" height="350" fill="#0B0F19" fill-opacity="0.8" />
    <line x1="260" y1="70" x2="260" y2="420" stroke="#334155" stroke-width="1" />

    <text x="60" y="100" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">
      DIALOGUE CONTEXT
    </text>

    <!-- Context Metric 1 -->
    <rect x="55" y="115" width="190" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="68" y="132" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Sliding Window Memory</text>
    <text x="68" y="147" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">5 Turns Active (Tokens: 312)</text>

    <!-- Context Metric 2 -->
    <rect x="55" y="165" width="190" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="68" y="182" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">NER Entities Detected</text>
    <text x="68" y="197" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ORG, GPE, DATE, MONEY</text>

    <!-- Context Metric 3 -->
    <rect x="55" y="215" width="190" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="68" y="232" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Intent &amp; Sentiment</text>
    <text x="68" y="247" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Intent: Query_Data (+0.92)</text>

    <!-- Export Buttons -->
    <text x="60" y="285" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">
      HISTORY EXPORT
    </text>
    <g transform="translate(55, 298)">
      <rect x="0" y="0" width="58" height="26" rx="4" fill="#1E293B" stroke="#475569" />
      <text x="14" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">JSON</text>

      <rect x="66" y="0" width="58" height="26" rx="4" fill="#1E293B" stroke="#475569" />
      <text x="78" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">DOCX</text>

      <rect x="132" y="0" width="58" height="26" rx="4" fill="#1E293B" stroke="#475569" />
      <text x="148" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">PDF</text>
    </g>

    <!-- Main Chat Pane -->
    <!-- Message 1: User -->
    <g transform="translate(280, 95)">
      <rect x="160" y="0" width="300" height="46" rx="10" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-width="1" />
      <text x="175" y="20" fill="#F0F9FF" font-family="'Inter', sans-serif" font-size="12">Analyze the customer quarterly report,</text>
      <text x="175" y="37" fill="#F0F9FF" font-family="'Inter', sans-serif" font-size="12">extract key milestones and revenue entities.</text>
    </g>

    <!-- Message 2: Bot -->
    <g transform="translate(280, 160)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="22" r="10" fill="url(#primary-glow)" />
      <text x="16" y="26" fill="#0F172A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">N</text>
      <text x="38" y="26" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">NovaChat AI</text>
      <text x="120" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">[Latency: 142ms]</text>

      <text x="20" y="55" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="12">
        Processed query using <tspan fill="#38BDF8" font-weight="600">spaCy NLU (v3.8)</tspan> with Qwen2.5-7B fallback:
      </text>

      <!-- Extracted Entities Pills -->
      <rect x="20" y="70" width="130" height="22" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
      <text x="28" y="85" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">REVENUE: $4.2M</text>

      <rect x="160" y="70" width="150" height="22" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="1" />
      <text x="168" y="85" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10">ORG: Apex Solutions</text>

      <rect x="320" y="70" width="120" height="22" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1" />
      <text x="328" y="85" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">DATE: Q4 2025</text>

      <text x="20" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">
        • Dialogue state updated &amp; persistent SQLite3 session synced.
      </text>
      <text x="20" y="132" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">
        • Context compressed with turn summarization (reduced 62% token bloat).
      </text>
    </g>

    <!-- Input Bar -->
    <g transform="translate(280, 335)">
      <rect x="0" y="0" width="460" height="48" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1.5" />
      <text x="18" y="29" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
        Type a message or command... (e.g. /summarize, /export)
      </text>
      <rect x="385" y="8" width="65" height="32" rx="6" fill="url(#primary-glow)" />
      <text x="403" y="28" fill="#0B0F19" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">Send</text>
    </g>
  </g>
</svg>

